kind = "web"
previewPath = "/"
title = "Libraryminds Video Generator"
version = "1.0.0"
id = "artifacts/video-generator"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24396

[services.development]
run = "pnpm --filter @workspace/video-generator run dev"

[services.production]
serve = "static"
publicDir = "artifacts/video-generator/dist/public"
build = "pnpm --filter @workspace/video-generator run build"

[services.env]
PORT = "24396"
BASE_PATH = "/"
