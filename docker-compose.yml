services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: libraryminds-video-generator:latest
    container_name: libraryminds
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8080
    volumes:
      # Persist generated videos + thumbnails between container restarts
      - video-outputs:/app/artifacts/api-server/outputs
      # Persist logo / music assets
      - video-assets:/app/artifacts/api-server/assets
      # PM2-style logs
      - ./logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:8080/api/healthz', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  video-outputs:
  video-assets:
